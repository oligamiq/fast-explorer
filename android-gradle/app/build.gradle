plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'dev.oligami.fastexplorer'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.oligami.fastexplorer'
        minSdk 30
        targetSdk 35
        versionCode 20000004
        versionName '0.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            java.srcDirs = ['../../android-java']
            res.srcDirs = ['../../android-res']
            jniLibs.srcDirs = [System.getenv('FASTEXPLORER_JNI_LIBS') ?: 'src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'com.android.tools.build:bundletool:1.18.3'
    implementation 'com.google.protobuf:protobuf-java:3.22.3'
    implementation 'com.google.guava:guava:32.0.1-android'
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-messaging'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
